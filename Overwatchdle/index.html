<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Overwatchdle</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Metrophobic&family=Teko:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="header">
      <h1 class="title">OVERWATCHDLE</h1>
      <p class="subtitle">Identify the secret hero. Every guess brings you closer.</p>
    </header>

    <div class="toolbar">
      <button id="stats-btn" class="btn" type="button">Stats</button>
      <button id="mode-btn" class="btn" type="button">Random hero</button>
    </div>

    <section class="hints" aria-label="Hints">
      <button class="hint" data-hint="quote" type="button">
        <span class="hint-label">Quote</span>
        <span class="hint-body">Click to reveal</span>
      </button>
      <button class="hint" data-hint="roleSpecies" type="button">
        <span class="hint-label">Role / Species</span>
        <span class="hint-body">Click to reveal</span>
      </button>
      <button class="hint" data-hint="origin" type="button">
        <span class="hint-label">Origin</span>
        <span class="hint-body">Click to reveal</span>
      </button>
    </section>

    <section class="search">
      <div class="search-box">
        <input id="guess-input" type="text" placeholder="Type a hero name…" autocomplete="off"
               role="combobox" aria-expanded="false" aria-controls="dropdown" disabled>
        <ul id="dropdown" class="dropdown" role="listbox" hidden></ul>
      </div>
      <p id="status" class="status" aria-live="polite"></p>
    </section>

    <section class="board" aria-label="Guesses">
      <div class="row row-head">
        <div class="tile head">Hero</div>
        <div class="tile head">Gender</div>
        <div class="tile head">Role</div>
        <div class="tile head">Species</div>
        <div class="tile head">Origin</div>
        <div class="tile head">Affiliation</div>
        <div class="tile head">Health</div>
        <div class="tile head">Year</div>
      </div>
      <div id="rows" class="rows"></div>
    </section>
  </main>
  <div id="modal" class="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button id="modal-close" class="modal-close" type="button" aria-label="Close">×</button>
      <h2 id="modal-title">Statistics</h2>
      <p id="modal-result" class="modal-result" hidden></p>
      <div class="stats-grid">
        <div><b id="st-won">0</b><span>Won</span></div>
        <div><b id="st-streak">0</b><span>Streak</span></div>
        <div><b id="st-best">0</b><span>Best</span></div>
        <div><b id="st-avg">–</b><span>Avg guesses</span></div>
      </div>
      <h3>Daily guess distribution</h3>
      <div id="dist" class="dist"></div>
      <div class="modal-actions">
        <button id="share-btn" class="btn primary" type="button" hidden>Copy result</button>
        <button id="random-btn" class="btn" type="button">Play random hero</button>
      </div>
      <p id="next-daily" class="next-daily"></p>
    </div>
  </div>

  <label class="bg-picker">Change background
    <input id="bg-input" type="file" accept="image/*" hidden>
  </label>

  <script src="script.js"></script>
</body>
</html>
